services:
  garmin-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garmin-mcp-server

    # Option 1: Use environment variables directly
    environment:
      - GARMIN_EMAIL=${GARMIN_EMAIL}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      - GARMIN_DATA_PATH=/app/data
      # - GARMIN_IS_CN=true           # Uncomment to use Garmin Connect China (garmin.cn)

      # --- Optional addons (off by default, base Garmin MCP works without these) ---
      # - GARMIN_TRACKER_ENABLED=true       # Enables raw data sync + query tools (SQLite)
      # - GARMIN_TRAINING_MEMORY=true       # Enables training plans, phases, notes, auto-matching (implies tracker)
      # - GARMIN_AUTO_MATCH_THRESHOLD=0.75  # 0.0-1.0 confidence required to auto-link planned→actual workout
      # - GARMIN_AUTO_MATCH_ENABLED=true    # Run auto-match whenever activities are synced

    # Option 2: Use file-based secrets (uncomment to use)
    # environment:
    #   - GARMIN_EMAIL_FILE=/run/secrets/garmin_email
    #   - GARMIN_PASSWORD_FILE=/run/secrets/garmin_password
    # secrets:
    #   - garmin_email
    #   - garmin_password

    # Mount volumes to persist Garmin OAuth tokens and tracker database
    volumes:
      - garmin-tokens:/root/.garminconnect
      - garmin-data:/app/data

    # Restart policy
    restart: unless-stopped

    # Optional: Set stdin_open and tty for interactive MFA input
    stdin_open: true
    tty: true

volumes:
  garmin-tokens:
    driver: local
  garmin-data:
    driver: local

# Uncomment if using file-based secrets
# secrets:
#   garmin_email:
#     file: ./secrets/garmin_email.txt
#   garmin_password:
#     file: ./secrets/garmin_password.txt
